# Development overrides. Interpolation (${DB_PASSWORD}) needs --env-file .env.development
# or a project .env file. `env_file:` on a service does NOT feed ${VAR} substitution.
#
# Default DB is the host PostgreSQL 16 on localhost:5432 (pgAdmin "PostgreSQL 16" / demo5_db).
# Compose hostname host.docker.internal reaches that from Colima. Optional in-Compose Postgres:
# COMPOSE_PROFILES=compose-db docker compose ... up postgres
services:
  postgres:
    profiles: ["compose-db"]
    image: postgres:16-alpine
    env_file:
      - .env.development
    environment:
      POSTGRES_DB: ${DB_NAME:-demo5_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.development}
    volumes:
      - postgres-development-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: "no"

  api:
    env_file:
      - .env.development
    environment:
      DJANGO_SETTINGS_MODULE: main.settings.development
      # Frontend container BFF calls http://host.docker.internal:8000 (Host not 127.0.0.1).
      ALLOWED_HOSTS: localhost,127.0.0.1,[::1],host.docker.internal
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://redis:6379/1
      GUNICORN_WORKERS: "1"
    volumes:
      - .:/app
      - /app/.venv
      - staticfiles:/app/staticfiles
    command:
      - gunicorn
      - main.asgi:application
      - --bind
      - 0.0.0.0:8000
      - --worker-class
      - uvicorn.workers.UvicornWorker
      - --workers
      - "1"
      - --reload
      - --timeout
      - "120"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - --capture-output
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  celery-worker:
    env_file:
      - .env.development
    environment:
      DJANGO_SETTINGS_MODULE: main.settings.development
      ALLOWED_HOSTS: localhost,127.0.0.1,[::1],host.docker.internal
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://redis:6379/1
    volumes:
      - .:/app
      - /app/.venv
      - staticfiles:/app/staticfiles
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  celery-beat:
    env_file:
      - .env.development
    environment:
      DJANGO_SETTINGS_MODULE: main.settings.development
      ALLOWED_HOSTS: localhost,127.0.0.1,[::1],host.docker.internal
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://redis:6379/1
    volumes:
      - .:/app
      - /app/.venv
      - staticfiles:/app/staticfiles
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  redis:
    restart: "no"

  nginx:
    ports:
      - "8000:80"
      - "8080:80"
    volumes:
      - ./docker/nginx/development.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
    restart: "no"

volumes:
  postgres-development-data:
